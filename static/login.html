<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sign in to the Good Luck Forwarding Systems Inc. fleet management workspace."
    />
    <title>Sign in · Good Luck Forwarding Systems Inc.</title>
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/login.css" />
    <script src="/static/login.js" defer></script>
  </head>
  <body>
    <main class="login-layout">
      <section class="login-card" aria-labelledby="login-title">
        <a class="login-brand" href="/login" aria-label="Good Luck Forwarding Systems">
          <span class="login-brand-mark" aria-hidden="true">GL</span>
          <span>
            <strong>Good Luck Forwarding</strong>
            <small>Systems Inc. · Fleet Management</small>
          </span>
        </a>
        <button class="login-theme-toggle" id="theme-toggle" type="button">
          <span class="theme-icon" aria-hidden="true">☾</span>
          <span class="theme-label">Dark mode</span>
        </button>
        <div class="login-heading">
          <p class="login-eyebrow">FLEET OPERATIONS WORKSPACE</p>
          <h1 id="login-title">Welcome back</h1>
          <p>Sign in with your authorized company account to continue.</p>
        </div>
        <form id="login-form">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="name@company.com"
            required
            autofocus
          />
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <p class="login-error" id="login-error" role="alert" hidden></p>
          <button class="login-submit" id="login-submit" type="submit">
            Sign in <span aria-hidden="true">→</span>
          </button>
        </form>
        <p class="login-help">Need access? Contact your system administrator.</p>
      </section>
      <footer class="login-footer">
        Designed &amp; Developed By: Edwin Angelo Catequista
        <span aria-hidden="true">·</span> Powered By: GLFS Incorporated
      </footer>
    </main>
  </body>
</html>
